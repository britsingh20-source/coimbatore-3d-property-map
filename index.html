<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0b5f50"/><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/><title>CoimbatoreVeedu 3D Property Map</title><link rel="stylesheet" href="/src/crm-team.css"/><link rel="stylesheet" href="/src/crm-queue.css"/></head><body><div id="app"></div><script src="%BASE_URL%runtime-config.js?v=20260901-3"></script><script src="%BASE_URL%fetch-timeout.js?v=20260901-3"></script><script>(()=>{const baseFetch=window.fetch.bind(window);const KEY='crm-login-proof-v3';const GRACE=120000;let proof=null;const load=()=>{if(proof)return proof;try{const p=JSON.parse(sessionStorage.getItem(KEY)||'null');if(p&&p.token&&p.accepted_at&&Date.now()-p.accepted_at<GRACE)return proof=p;sessionStorage.removeItem(KEY)}catch(_){}return null};const save=d=>{if(!d?.token)return;proof={token:d.token,employee_id:d.employee_id,user_label:d.user_label,role:d.role,login_at:d.login_at,idle_timeout_minutes:d.idle_timeout_minutes||10,accepted_at:Date.now()};try{sessionStorage.setItem(KEY,JSON.stringify(proof))}catch(_){}};const auth=init=>{try{const h=new Headers(init?.headers||{}),v=h.get('authorization')||'';return v.startsWith('Bearer ')?v.slice(7):''}catch(_){return''}};const synth=p=>new Response(JSON.stringify({ok:true,employee_id:p.employee_id,user_label:p.user_label,role:p.role,login_at:p.login_at||new Date().toISOString(),last_activity_at:new Date().toISOString(),call_active:false,idle_timeout_minutes:p.idle_timeout_minutes||10,login_grace:true}),{status:200,headers:{'content-type':'application/json; charset=utf-8'}});window.fetch=async(input,init={})=>{const url=typeof input==='string'?input:(input?.url||'');const isLogin=/\/api\/session\/login(?:\?|$)/.test(url),isVerify=/\/api\/session\/me(?:\?|$)/.test(url);if(isLogin){const r=await baseFetch(input,init);if(r.ok)try{save(await r.clone().json())}catch(_){}return r}if(isVerify){const p=load(),t=auth(init);try{const r=await baseFetch(input,init);if(r.ok){proof=null;try{sessionStorage.removeItem(KEY)}catch(_){}return r}if(p&&t===p.token&&Date.now()-p.accepted_at<GRACE&&[401,408,425,429,500,502,503,504].includes(r.status))return synth(p);return r}catch(e){if(p&&t===p.token&&Date.now()-p.accepted_at<GRACE)return synth(p);throw e}}return baseFetch(input,init)}})();</script><script src="%BASE_URL%loading-failsafe.js?v=20260901-3"></script><script type="module" src="/src/main.js?v=20260901-3"></script><script type="module" src="/src/admin-loader.js?v=20260901-3"></script></body></html>
