name: Mobile Lead Card Hotfix
on:
  push:
    branches: [fix/mobile-lead-card-tap]
    paths: [.github/workflows/mobile-lead-card-hotfix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-lead-card-tap
      - name: Patch mobile lead card tap behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js=Path('src/lead-crm.js')
          s=js.read_text()
          old='''      <button data-open-lead="${lead.id}">Open →</button>\n    </article>`).join("") || `<div class="crm-empty">No leads match this filter.</div>`;\n  document.querySelectorAll("[data-open-lead]").forEach((button) => button.onclick = () => openLead(button.dataset.openLead));'''
          new='''      <button class="crm-open" type="button" data-open-lead="${lead.id}">Open →</button>\n    </article>`).join("") || `<div class="crm-empty">No leads match this filter.</div>`;\n  document.querySelectorAll(".crm-lead-row[data-lead]").forEach((row) => {\n    row.setAttribute("role", "button");\n    row.setAttribute("tabindex", "0");\n    row.onclick = (event) => { if (!event.target.closest("button,a,input,select,textarea")) openLead(row.dataset.lead); };\n    row.onkeydown = (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openLead(row.dataset.lead); } };\n  });\n  document.querySelectorAll("[data-open-lead]").forEach((button) => button.onclick = (event) => { event.stopPropagation(); openLead(button.dataset.openLead); });'''
          if old not in s: raise SystemExit('lead list target not found')
          js.write_text(s.replace(old,new,1))

          css=Path('src/lead-crm.css')
          c=css.read_text()
          append='''\n/* Mobile CRM lead-card tap fix */\n.crm-lead-row{touch-action:manipulation;-webkit-tap-highlight-color:rgba(23,107,89,.12)}\n.crm-lead-row:active{border-color:#7fb8aa;background:#f7fbfa}\n.crm-open{min-width:88px;min-height:44px;font-size:14px;touch-action:manipulation}\n@media(max-width:780px){\n  .crm-lead-row{grid-template-columns:minmax(0,1fr) auto;gap:10px;min-height:118px;padding:16px;align-items:center}\n  .crm-lead-row>div:first-child{grid-column:1/-1}\n  .crm-lead-row>div:first-child b{font-size:18px;line-height:1.25}\n  .crm-lead-row>span:not(.crm-status){justify-self:start}\n  .crm-lead-row>.crm-status{justify-self:start}\n  .crm-lead-row>.crm-open{justify-self:end;align-self:center;padding:11px 16px;border-radius:12px}\n}\n@media(max-width:520px){\n  .crm-lead-row{min-height:132px}\n  .crm-lead-row>.crm-open{min-width:104px;min-height:48px;font-size:15px}\n}\n'''
          if '/* Mobile CRM lead-card tap fix */' not in c:
              css.write_text(c+append)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-lead-card-hotfix.yml
          git add src/lead-crm.js src/lead-crm.css
          git commit -m "Make mobile CRM customer cards easy to open"
          git push origin HEAD:fix/mobile-lead-card-tap
