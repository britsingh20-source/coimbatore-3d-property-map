name: Diagnose Area Landing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-area-landing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      DB_NAME: coimbatore-lead-crm
      API: https://coimbatore-lead-crm-api.britsingh20.workers.dev
      ORIGIN: https://britsingh20-source.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save wrangler@latest
      - name: Resolve D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100")
          DB_ID=$(echo "$LIST" | jq -r --arg NAME "$DB_NAME" '.result[]? | select(.name==$NAME) | .uuid' | head -n1)
          [ -n "$DB_ID" ] || exit 1
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Configure Wrangler
        shell: bash
        run: |
          cat > wrangler.diag.toml <<EOF
          name = "area-landing-diagnostics"
          compatibility_date = "2026-09-01"
          [[d1_databases]]
          binding = "DB"
          database_name = "${DB_NAME}"
          database_id = "${{ steps.d1.outputs.db_id }}"
          EOF
      - name: Test live area-selection endpoint
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.diag.toml --json --command "SELECT whatsapp_prefill_token FROM social_leads WHERE keyword='AREA' ORDER BY id DESC LIMIT 1")
          TOKEN=$(echo "$RAW" | jq -r '.[0].results[0].whatsapp_prefill_token // empty')
          [ -n "$TOKEN" ] || { echo 'NO_AREA_TOKEN=true'; exit 1; }

          echo '=== OPTIONS ==='
          curl -sS -D /tmp/options.h -o /tmp/options.b -X OPTIONS "$API/api/social/area/select" \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type'
          grep -Ei '^(HTTP/|access-control-allow-|content-type:)' /tmp/options.h || true

          echo '=== POST ==='
          STATUS=$(curl -sS -D /tmp/post.h -o /tmp/post.b -w '%{http_code}' -X POST "$API/api/social/area/select" \
            -H "Origin: $ORIGIN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg ref "$TOKEN" '{ref:$ref,area:"Kalapatti"}')")
          echo "POST_STATUS=$STATUS"
          grep -Ei '^(HTTP/|access-control-allow-|content-type:)' /tmp/post.h || true
          jq '{ok,error,area,status,has_whatsapp_url:(.whatsapp_url != null)}' /tmp/post.b || cat /tmp/post.b
          test "$STATUS" = '200'
          jq -e '.ok == true and .area == "Kalapatti" and (.whatsapp_url | type == "string")' /tmp/post.b >/dev/null
