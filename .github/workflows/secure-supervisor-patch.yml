name: Secure Supervisor Patch

on:
  push:
    branches:
      - fix/director-followup-save-actual

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/director-followup-save-actual
      - run: python3 scripts/secure_supervisor_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/secure-supervisor-patch.yml scripts/secure_supervisor_patch.py
          git add cloudflare/worker.js src/lead-crm.js
          git commit -m "Secure Director lead edit route"
          git push origin HEAD:fix/director-followup-save-actual
