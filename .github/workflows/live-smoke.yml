name: Live CRM Smoke Test

on:
  workflow_run:
    workflows: ["Deploy 3D Property Map"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIVE_URL: https://britsingh20-source.github.io/coimbatore-3d-property-map/
      API_URL: https://coimbatore-lead-crm-api.britsingh20.workers.dev
      TC01_PIN: ${{ secrets.TC01_PIN }}
      TC02_PIN: ${{ secrets.TC02_PIN }}
      MG01_PIN: ${{ secrets.MG01_PIN }}
      MG02_PIN: ${{ secrets.MG02_PIN }}
      AD01_PIN: ${{ secrets.AD01_PIN }}
      DR01_PIN: ${{ secrets.DR01_PIN }}
    steps:
      - name: Verify backend health
        run: |
          curl -fsS "$API_URL/api/health" | tee /tmp/health.json
          jq -e '.ok == true' /tmp/health.json >/dev/null
      - name: Verify public CRM page
        run: |
          HTTP=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$LIVE_URL")
          test "$HTTP" = "200"
          grep -q "Coimbatore" /tmp/page.html
          grep -q '/assets/index.js' /tmp/page.html
          curl -fsS "${LIVE_URL%/}/assets/index.js" -o /tmp/index.js
          test -s /tmp/index.js
      - name: Verify mobile page renders twice
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          [ -n "$CHROME" ] || { echo "Chrome/Chromium not found"; exit 1; }
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          for RUN in 1 2; do
            OUT="/tmp/mobile-render-$RUN.html"
            rm -f "$OUT"
            set +e
            timeout 25s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-component-update --no-first-run --disable-sync --user-agent="$UA" --window-size=390,844 --virtual-time-budget=5000 --dump-dom "${LIVE_URL}?browser_smoke=${GITHUB_RUN_ID}-${RUN}" > "$OUT" 2>/tmp/chrome-$RUN.log
            CODE=$?
            set -e
            if [ ! -s "$OUT" ]; then
              echo "Mobile browser run $RUN produced no DOM (exit $CODE)"
              cat /tmp/chrome-$RUN.log
              exit 1
            fi
            grep -q 'id="map"' "$OUT"
            grep -q 'CoimbatoreVeedu' "$OUT"
            if grep -q '<div id="app"></div>' "$OUT"; then
              echo "Mobile browser run $RUN rendered a blank app"
              exit 1
            fi
            echo "Mobile browser render $RUN PASS"
          done
      - name: Verify real lead inventory
        run: |
          curl -fsS "$API_URL/api/leads" > /tmp/leads.json
          TOTAL=$(jq '.leads | length' /tmp/leads.json)
          echo "Live unique leads: $TOTAL"
          test "$TOTAL" -ge 184
      - name: Verify public area API
        run: |
          curl -fsS "$API_URL/api/areas" | tee /tmp/areas.json
          jq -e '.areas | type == "array"' /tmp/areas.json >/dev/null
      - name: Verify all six staff logins, sessions and telecaller batches
        shell: bash
        run: |
          set -euo pipefail
          check_login() {
            ID="$1"; PIN="$2"
            [ -n "$PIN" ] || { echo "$ID PIN secret missing"; exit 1; }
            LOGIN_CODE=$(curl -sS -o /tmp/login.json -w '%{http_code}' -X POST "$API_URL/api/session/login" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg employee_id "$ID" --arg pin "$PIN" '{employee_id:$employee_id,pin:$pin}')")
            if [ "$LOGIN_CODE" != 200 ]; then
              echo "$ID login failed: HTTP $LOGIN_CODE"
              jq -c 'del(.token,.pin,.pin_hash)' /tmp/login.json 2>/dev/null || cat /tmp/login.json
              exit 1
            fi
            LOGIN=$(cat /tmp/login.json)
            TOKEN=$(echo "$LOGIN" | jq -r '.token // empty')
            test -n "$TOKEN"
            echo "$LOGIN" | jq -e --arg ID "$ID" '.ok == true and .employee_id == $ID and (.user_label|length>0) and (.role|length>0)' >/dev/null
            OK=0
            for WAIT in 0 1 2 3 5; do
              [ "$WAIT" = 0 ] || sleep "$WAIT"
              CODE=$(curl -sS -o /tmp/session.json -w '%{http_code}' "$API_URL/api/session/me" -H "Authorization: Bearer $TOKEN")
              if [ "$CODE" = 200 ] && jq -e --arg ID "$ID" '.ok == true and .employee_id == $ID' /tmp/session.json >/dev/null; then OK=1; break; fi
            done
            if [ "$OK" != 1 ]; then
              echo "$ID session verification failed: HTTP $CODE"
              jq -c 'del(.token)' /tmp/session.json 2>/dev/null || cat /tmp/session.json
              exit 1
            fi
            if [ "$ID" = "TC01" ] || [ "$ID" = "TC02" ]; then
              BATCH_CODE=$(curl -sS -o /tmp/batch.json -w '%{http_code}' "$API_URL/api/telecaller/batch" -H "Authorization: Bearer $TOKEN")
              if [ "$BATCH_CODE" != 200 ]; then
                echo "$ID batch failed: HTTP $BATCH_CODE"
                jq -c '.' /tmp/batch.json 2>/dev/null || cat /tmp/batch.json
                exit 1
              fi
              BATCH_COUNT=$(jq '.leads | length' /tmp/batch.json)
              QUEUE=$(jq -r '.queue // "unknown"' /tmp/batch.json)
              echo "$ID current batch: $BATCH_COUNT ($QUEUE)"
              if [ "$BATCH_COUNT" -lt 1 ]; then
                echo "$ID has no assigned Current 10 leads"
                exit 1
              fi
            fi
            LOGOUT_OK=0
            for WAIT in 0 1 2; do
              [ "$WAIT" = 0 ] || sleep "$WAIT"
              LOGOUT_CODE=$(curl -sS -o /tmp/logout.json -w '%{http_code}' -X POST "$API_URL/api/session/logout" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{}')
              if [ "$LOGOUT_CODE" = 200 ]; then LOGOUT_OK=1; break; fi
            done
            if [ "$LOGOUT_OK" != 1 ]; then
              echo "$ID logout warning: HTTP $LOGOUT_CODE"
              jq -c 'del(.token)' /tmp/logout.json 2>/dev/null || cat /tmp/logout.json
              exit 1
            fi
            echo "$ID login/session PASS"
          }
          check_login TC01 "$TC01_PIN"
          check_login TC02 "$TC02_PIN"
          check_login MG01 "$MG01_PIN"
          check_login MG02 "$MG02_PIN"
          check_login AD01 "$AD01_PIN"
          check_login DR01 "$DR01_PIN"
