name: Live CRM Smoke Test

on:
  workflow_run:
    workflows: ["Deploy 3D Property Map"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LIVE_URL: https://britsingh20-source.github.io/coimbatore-3d-property-map/
      API_URL: https://coimbatore-lead-crm-api.britsingh20.workers.dev
    steps:
      - name: Verify backend health
        run: |
          curl -fsS "$API_URL/api/health" | tee /tmp/health.json
          jq -e '.ok == true' /tmp/health.json >/dev/null
      - name: Verify public CRM page
        run: |
          HTTP=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$LIVE_URL")
          test "$HTTP" = "200"
          grep -q "Coimbatore" /tmp/page.html
      - name: Verify public area API
        run: |
          curl -fsS "$API_URL/api/areas" | tee /tmp/areas.json
          jq -e '.areas | type == "array"' /tmp/areas.json >/dev/null
