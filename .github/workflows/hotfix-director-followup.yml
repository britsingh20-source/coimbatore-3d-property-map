name: Hotfix Director Follow-up Save

on:
  push:
    branches:
      - fix/director-followup-save-actual

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/director-followup-save-actual
      - name: Apply patch
        run: python3 scripts/hotfix_director_followup.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-director-followup.yml scripts/hotfix_director_followup.py
          git add cloudflare/worker.js src/lead-crm.js
          git commit -m "Fix Director follow-up and lead edits"
          git push origin HEAD:fix/director-followup-save-actual
