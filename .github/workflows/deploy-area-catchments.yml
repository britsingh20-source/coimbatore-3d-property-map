name: Deploy CRM Area Catchments

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-area-catchments:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      DB_NAME: coimbatore-lead-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Resolve D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100")
          DB_ID=$(echo "$LIST" | jq -r --arg NAME "$DB_NAME" '.result[]? | select(.name==$NAME) | .uuid' | head -n1)
          [ -n "$DB_ID" ] || { echo "D1 database not found"; exit 1; }
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Generate Wrangler config
        run: |
          cat > wrangler.catchments.toml <<EOF
          name = "crm-area-catchments"
          main = "cloudflare/main-area-priority.js"
          compatibility_date = "2026-08-31"
          [[d1_databases]]
          binding = "DB"
          database_name = "${DB_NAME}"
          database_id = "${{ steps.d1.outputs.db_id }}"
          EOF
      - name: Apply catchment mappings
        run: npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.catchments.toml --file cloudflare/area_catchment_zones.sql
      - name: Verify catchments
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.catchments.toml --command "SELECT parent_code,parent_name,radius_km FROM area_catchments ORDER BY parent_code")
          echo "$OUT" | grep -q 'VDV'
          echo "$OUT" | grep -q 'IDG'
          echo "$OUT" | grep -q 'SRV'
          echo "$OUT" | grep -q 'KLP'
          echo "$OUT" | grep -q 'SLR'
