name: Deploy CRM Backend to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-crm-backend.yml'
      - 'cloudflare/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-crm-backend:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      CRM_IMPORT_TOKEN: ${{ secrets.CRM_IMPORT_TOKEN }}
      TC01_PIN: ${{ secrets.TC01_PIN }}
      TC02_PIN: ${{ secrets.TC02_PIN }}
      MG01_PIN: ${{ secrets.MG01_PIN }}
      MG02_PIN: ${{ secrets.MG02_PIN }}
      AD01_PIN: ${{ secrets.AD01_PIN }}
      DR01_PIN: ${{ secrets.DR01_PIN }}
      DB_NAME: coimbatore-lead-crm
      WORKER_NAME: coimbatore-lead-crm-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Find or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100")
          DB_ID=$(echo "$LIST" | jq -r --arg NAME "$DB_NAME" '.result[]? | select(.name==$NAME) | .uuid' | head -n1)
          if [ -z "$DB_ID" ]; then
            CREATE=$(curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data "{\"name\":\"${DB_NAME}\"}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database")
            DB_ID=$(echo "$CREATE" | jq -r '.result.uuid // empty')
          fi
          [ -n "$DB_ID" ] || { echo "Unable to resolve D1 database id"; exit 1; }
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Generate Wrangler config
        shell: bash
        run: |
          cat > wrangler.crm.toml <<EOF
          name = "${WORKER_NAME}"
          main = "cloudflare/main-with-hours.js"
          compatibility_date = "2026-08-31"
          workers_dev = true
          [vars]
          FRONTEND_ORIGIN = "https://britsingh20-source.github.io"
          [[d1_databases]]
          binding = "DB"
          database_name = "${DB_NAME}"
          database_id = "${{ steps.d1.outputs.db_id }}"
          EOF
      - name: Initialize D1 schema
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.crm.toml --file cloudflare/schema.sql
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.crm.toml --file cloudflare/team_roles.sql || true
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.crm.toml --file cloudflare/dual_queue.sql || true
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.crm.toml --file cloudflare/real_lead_intake.sql || true
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.crm.toml --file cloudflare/telecaller_sessions.sql
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.crm.toml --file cloudflare/telecaller_credentials.sql
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.crm.toml --file cloudflare/fix_staff_fk_aliases.sql
      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.crm.toml | tee /tmp/wrangler-deploy.txt
          WORKER_URL=$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/wrangler-deploy.txt | tail -n1 || true)
          if [ -z "$WORKER_URL" ]; then
            SUBDOMAIN=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" | jq -r '.result.subdomain // empty')
            [ -z "$SUBDOMAIN" ] || WORKER_URL="https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev"
          fi
          [ -n "$WORKER_URL" ] || { echo "Unable to determine Worker URL"; exit 1; }
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
      - name: Configure secure import token
        if: ${{ env.CRM_IMPORT_TOKEN != '' }}
        run: printf '%s' "$CRM_IMPORT_TOKEN" | npx wrangler secret put IMPORT_TOKEN --config wrangler.crm.toml
      - name: Configure staff PINs
        if: ${{ env.CRM_IMPORT_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.deploy.outputs.worker_url }}'
          set_pin() {
            ID="$1"; PIN="$2"
            [ -z "$PIN" ] && { echo "$ID PIN secret missing"; exit 1; }
            [[ "$PIN" =~ ^[0-9]{3}$ ]] || { echo "$ID PIN must be exactly 3 digits"; exit 1; }
            curl -fsS -X POST "$URL/api/admin/staff/set-pin" \
              -H "Authorization: Bearer $CRM_IMPORT_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg employee_id "$ID" --arg pin "$PIN" '{employee_id:$employee_id,pin:$pin}')" >/dev/null
            echo "$ID PIN configured"
          }
          set_pin TC01 "$TC01_PIN"
          set_pin TC02 "$TC02_PIN"
          set_pin MG01 "$MG01_PIN"
          set_pin MG02 "$MG02_PIN"
          set_pin AD01 "$AD01_PIN"
          set_pin DR01 "$DR01_PIN"
      - name: Verify backend health
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          URL='${{ steps.deploy.outputs.worker_url }}'
          curl -fsS "$URL/api/health"
          STATUS=$(curl -sS -o /tmp/work-hours-probe.json -w '%{http_code}' "$URL/api/work-hours")
          test "$STATUS" = "401"
          jq -e '.error == "Session expired"' /tmp/work-hours-probe.json >/dev/null
          echo "CRM and working-hours routes are live"
      - name: Update frontend runtime API URL
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.deploy.outputs.worker_url }}'
          mkdir -p public
          {
            printf 'window.LEAD_API_BASE = %s;\n' "$(printf '%s' "$URL" | jq -Rs .)"
            printf 'window.WORK_HOURS_API_BASE = %s;\n' "$(printf '%s' "$URL" | jq -Rs .)"
          } > public/runtime-config.js
          if git diff --quiet -- public/runtime-config.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/runtime-config.js
          git commit -m "Connect CRM frontend to Cloudflare Worker"
          git pull --rebase origin main
          git push origin HEAD:main
