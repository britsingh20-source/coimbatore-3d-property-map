name: Deploy CRM Backend to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-crm-backend.yml'
      - 'cloudflare/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-crm-backend:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      CRM_IMPORT_TOKEN: ${{ secrets.CRM_IMPORT_TOKEN }}
      DB_NAME: coimbatore-lead-crm
      WORKER_NAME: coimbatore-lead-crm-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing in GitHub Actions secrets"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID (or R2_ACCOUNT_ID) is missing in GitHub Actions secrets"
            exit 1
          fi

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Find or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100")
          DB_ID=$(echo "$LIST" | jq -r --arg NAME "$DB_NAME" '.result[]? | select(.name==$NAME) | .uuid' | head -n1)
          if [ -z "$DB_ID" ]; then
            CREATE=$(curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${DB_NAME}\"}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database")
            DB_ID=$(echo "$CREATE" | jq -r '.result.uuid // empty')
          fi
          if [ -z "$DB_ID" ]; then
            echo "Unable to resolve D1 database id"
            exit 1
          fi
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "D1 ready: $DB_NAME"

      - name: Generate Wrangler config
        shell: bash
        run: |
          cat > wrangler.crm.toml <<EOF
          name = "${WORKER_NAME}"
          main = "cloudflare/worker.js"
          compatibility_date = "2026-08-31"
          workers_dev = true

          [vars]
          FRONTEND_ORIGIN = "https://britsingh20-source.github.io"

          [[d1_databases]]
          binding = "DB"
          database_name = "${DB_NAME}"
          database_id = "${{ steps.d1.outputs.db_id }}"
          EOF

      - name: Initialize D1 schema
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.crm.toml --file cloudflare/schema.sql
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.crm.toml --file cloudflare/team_roles.sql || true
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.crm.toml --file cloudflare/dual_queue.sql || true
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.crm.toml --file cloudflare/real_lead_intake.sql || true

      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.crm.toml | tee /tmp/wrangler-deploy.txt
          WORKER_URL=$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/wrangler-deploy.txt | tail -n1 || true)
          if [ -z "$WORKER_URL" ]; then
            SUBDOMAIN=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" | jq -r '.result.subdomain // empty')
            if [ -n "$SUBDOMAIN" ]; then
              WORKER_URL="https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev"
            fi
          fi
          if [ -z "$WORKER_URL" ]; then
            echo "Unable to determine Worker URL"
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $WORKER_URL"

      - name: Configure secure import token
        if: ${{ env.CRM_IMPORT_TOKEN != '' }}
        shell: bash
        run: printf '%s' "$CRM_IMPORT_TOKEN" | npx wrangler secret put IMPORT_TOKEN --config wrangler.crm.toml

      - name: Verify backend health
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS "${{ steps.deploy.outputs.worker_url }}/api/health"

      - name: Update frontend runtime API URL
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.deploy.outputs.worker_url }}'
          printf 'window.LEAD_API_BASE = %s;\n' "$(printf '%s' "$URL" | jq -Rs .)" > src/runtime-config.js
          if git diff --quiet -- src/runtime-config.js; then
            echo "Runtime config already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime-config.js
          git commit -m "Connect CRM frontend to Cloudflare Worker"
          git push origin HEAD:main
