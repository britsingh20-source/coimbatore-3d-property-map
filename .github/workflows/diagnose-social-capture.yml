name: Diagnose Social CRM Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-social-capture.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      DB_NAME: coimbatore-lead-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save wrangler@latest
      - name: Resolve D1
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100")
          DB_ID=$(echo "$LIST" | jq -r --arg NAME "$DB_NAME" '.result[]? | select(.name==$NAME) | .uuid' | head -n1)
          test -n "$DB_ID"
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Configure D1
        run: |
          cat > wrangler.social-diagnose.toml <<EOF
          name = "crm-social-diagnose"
          compatibility_date = "2026-09-01"
          [[d1_databases]]
          binding = "DB"
          database_name = "$DB_NAME"
          database_id = "${{ steps.d1.outputs.db_id }}"
          EOF
      - name: Read safe social capture counters
        shell: bash
        run: |
          set -euo pipefail
          echo '--- SOCIAL LEADS BY STATUS ---'
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.social-diagnose.toml --command "SELECT status,COUNT(*) count FROM social_leads GROUP BY status ORDER BY count DESC"
          echo '--- SOCIAL EVENTS ---'
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.social-diagnose.toml --command "SELECT event_type,COUNT(*) count,MAX(created_at) latest FROM social_lead_events GROUP BY event_type ORDER BY count DESC"
          echo '--- META RECEIPTS LAST 24H ---'
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.social-diagnose.toml --command "SELECT object_type,field_name,COUNT(*) count,MAX(received_at) latest FROM meta_webhook_receipts WHERE received_at>=datetime('now','-1 day') GROUP BY object_type,field_name ORDER BY count DESC"
          echo '--- LINKED SOCIAL LEADS ---'
          npx wrangler d1 execute "$DB_NAME" --remote --config wrangler.social-diagnose.toml --command "SELECT COUNT(*) total, SUM(CASE WHEN whatsapp_phone IS NOT NULL THEN 1 ELSE 0 END) with_phone, SUM(CASE WHEN lead_id IS NOT NULL THEN 1 ELSE 0 END) linked_crm FROM social_leads"
