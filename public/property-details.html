<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Property Details - Choose Area</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a}.wrap{max-width:560px;margin:0 auto;padding:28px 18px 36px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 40px rgba(15,23,42,.08)}h1{font-size:25px;line-height:1.2;margin:0 0 8px}p{margin:0 0 22px;color:#475569;line-height:1.5}.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px}.area{display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #dbe4ee;background:#fff;border-radius:16px;padding:16px 12px;font-size:16px;font-weight:700;color:#0f172a;cursor:pointer;min-height:56px}.area:active{transform:scale(.985)}.status{display:none;margin-top:18px;padding:14px;border-radius:14px;background:#f1f5f9;color:#334155;font-size:14px}.status.show{display:block}.brand{font-size:13px;color:#64748b;text-align:center;margin-top:16px}@media(max-width:380px){.areas{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Choose your preferred area</h1>
      <p>Tap an area to get property details on WhatsApp.</p>
      <div class="areas" id="areas"></div>
      <div class="status" id="status"></div>
    </section>
    <div class="brand">Coimbatore Property Details</div>
  </main>
<script>
(() => {
  const API='https://coimbatore-lead-crm-api.britsingh20.workers.dev';
  const WHATSAPP_NUMBER='918148127587';
  const AREAS=['Kalapatti','Saravanampatti','Vadavalli','Sulur','Karamadai','Kovilpalayam','Annur','Mettupalayam','Malumichampatti'];
  const params=new URLSearchParams(location.search);
  const ref=(params.get('ref')||'').trim().toUpperCase();
  const box=document.getElementById('areas');
  const status=document.getElementById('status');
  const show=(text)=>{status.textContent=text;status.classList.add('show')};

  if(!ref){
    show('This link is missing the enquiry reference. Please open the latest link sent to you on Instagram.');
    return;
  }

  function trackSelection(area){
    const body=JSON.stringify({ref,area});
    try {
      if(navigator.sendBeacon){
        const blob=new Blob([body],{type:'text/plain;charset=UTF-8'});
        navigator.sendBeacon(`${API}/api/social/area/select`,blob);
        return;
      }
    } catch (_) {}
    try {
      fetch(`${API}/api/social/area/select`,{method:'POST',headers:{'content-type':'application/json'},body,keepalive:true,mode:'cors'}).catch(()=>{});
    } catch (_) {}
  }

  AREAS.forEach(area=>{
    const message=`Hi, I need property details in ${area}. Ref: ${ref}`;
    const whatsapp=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    const link=document.createElement('a');
    link.className='area';
    link.textContent=area;
    link.href=whatsapp;
    link.addEventListener('click',()=>trackSelection(area),{passive:true});
    box.appendChild(link);
  });
})();
</script>
</body>
</html>
