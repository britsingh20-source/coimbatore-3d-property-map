<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Property Details - Choose Area</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a}.wrap{max-width:560px;margin:0 auto;padding:28px 18px 36px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 40px rgba(15,23,42,.08)}h1{font-size:25px;line-height:1.2;margin:0 0 8px}p{margin:0 0 22px;color:#475569;line-height:1.5}.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px}.area{appearance:none;border:1px solid #dbe4ee;background:#fff;border-radius:16px;padding:16px 12px;font-size:16px;font-weight:700;color:#0f172a;cursor:pointer;min-height:56px}.area:active{transform:scale(.985)}.area[disabled]{opacity:.55;cursor:wait}.status{display:none;margin-top:18px;padding:14px;border-radius:14px;background:#f1f5f9;color:#334155;font-size:14px}.status.show{display:block}.brand{font-size:13px;color:#64748b;text-align:center;margin-top:16px}@media(max-width:380px){.areas{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Choose your preferred area</h1>
      <p>Tap an area to get property details on WhatsApp.</p>
      <div class="areas" id="areas"></div>
      <div class="status" id="status"></div>
    </section>
    <div class="brand">Coimbatore Property Details</div>
  </main>
<script>
(() => {
  const API='https://coimbatore-lead-crm-api.britsingh20.workers.dev';
  const AREAS=['Kalapatti','Saravanampatti','Vadavalli','Sulur','Karamadai','Kovilpalayam','Annur','Mettupalayam','Malumichampatti'];
  const params=new URLSearchParams(location.search);
  const ref=(params.get('ref')||'').trim().toUpperCase();
  const box=document.getElementById('areas');
  const status=document.getElementById('status');
  const show=(text)=>{status.textContent=text;status.classList.add('show')};
  const setDisabled=(v)=>document.querySelectorAll('.area').forEach(b=>b.disabled=v);

  async function choose(area){
    if(!ref){show('This enquiry link is invalid. Please return to Instagram and request property details again.');return;}
    setDisabled(true);
    show(`Opening WhatsApp for ${area} property details...`);
    try{
      const res=await fetch(`${API}/api/social/area/select`,{
        method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({ref,area})
      });
      const data=await res.json().catch(()=>({}));
      if(!res.ok||!data.ok||!data.whatsapp_url)throw new Error(data.error||'Unable to continue');
      location.href=data.whatsapp_url;
    }catch(err){
      setDisabled(false);
      show(err.message||'Unable to open WhatsApp. Please try again.');
    }
  }

  AREAS.forEach(area=>{
    const button=document.createElement('button');
    button.className='area';
    button.type='button';
    button.textContent=area;
    button.addEventListener('click',()=>choose(area));
    box.appendChild(button);
  });

  if(!ref)show('This link is missing the enquiry reference. Please open the latest link sent to you on Instagram.');
})();
</script>
</body>
</html>
